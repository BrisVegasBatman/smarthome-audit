<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Smart Home Audit</title>
    <style>
        body { 
            background-color: #121212; 
            color: #e0e0e0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 2rem; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            max-width: 600px; 
            background: #1e1e1e; 
            padding: 2rem; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        h1 { color: #ffffff; font-size: 1.8rem; margin-top: 0; }
        p { margin-bottom: 1.5rem; line-height: 1.5; color: #b3b3b3; }
        label { display: block; margin-bottom: 0.3rem; font-weight: 500; }
        input, textarea { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 1.2rem; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            border-radius: 4px; 
            box-sizing: border-box;
        }
        input:focus, textarea:focus { outline: none; border-color: #007bff; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #007bff; 
            color: #fff; 
            border: none; 
            border-radius: 4px; 
            font-size: 1rem;
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Remote Smart Home Audit</h1>
        <p>Struggling with Wi-Fi dead zones, offline cameras, or broken automation? Drop your current setup details below. I will send you a custom diagnostic and the exact hardware required to fix it permanently.</p>
        
        <!-- Formspree Endpoint Integrated Here -->
        <form action="https://formspree.io/f/mbggklej" method="POST">
            <label for="name">First Name</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
            
            <label for="issue">Current Setup & Issue</label>
            <textarea id="issue" name="issue" rows="4" placeholder="E.g., My Swann cameras drop offline, or my Google Home routine is failing..." required></textarea>
            
            <button type="submit">Request Free Audit</button>
        </form>
    </div>
</body>
</html>
